<head>
    <link rel="stylesheet" href="css/output.css">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
</head>

<body class="min-h-screen bg-[#F5E8D3]">
    <main class="min-h-screen flex justify-center items-center p-4" >
        
     
     <div class="w-full  h-[90%] md:h-[300px] md:w-[800px]  bg-[#FFF9F0] p-10 rounded-lg shadow-md" >
            <form action="" id="loginform">
                

                  <label class="block  text-lg mb-1 text-[#7A263A]" for="email">Email</label><input  id="email" required  type="email" placeholder="Enter your  email"  class="border-2 border w-full rounded-md focus:border-[#7A263A] focus:outline-none  p-1">
                   <label class="block    text-lg text-[#7A263A]  mb-1" for="password">Password</label><input   id="password" required type="password" placeholder="Enter password" class="border-2 w-full rounded-md focus:border-[#7A263A] focus:outline-none  p-1" >
                  <button class="block  mt-1 p-2 bg-blue-700 text-white rounded-xl"> log in</button>
                  

                 
                 <p class="text-lg m-2 "> Don't have an acount ? <a href="register.html"  class="text-lg text-blue-700 font-bold ">Register</a>
                  </p>
                  <input type="checkbox"> Remember Me
            </form>
       </div>
       </main>
        <script src="js/login.js"></script>
</body>

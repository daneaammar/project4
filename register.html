<head>
    <link rel="stylesheet" href="css/output.css">
    <title>Register</title>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="min-h-screen bg-[#F5E8D3]">
    <main class="min-h-screen flex justify-center items-center p-4" >
        
     
     <div class="w-full  h-[90%] md:h-[400px] md:w-[800px]  bg-[#FFF9F0] p-10 rounded-lg shadow-xl" >
            <form action="" id="registerform">
                <div class="grid grid-cols-1  md:grid-cols-2 gap-x-4">
                <div><label for="fisrtn"  class="   text-lg text-[#7A263A]">First Name</label>
                <input type="text" required placeholder="Enter first name" id="firstn"  class="border-2 rounded-md  w-full border-black focus:border-[#7A263A] focus:outline-none p-1"></div>
                
               <div> <label for="lastn"  class="text-[#7A263A]  text-lg"> Last Name</label>
                
                <input type="text"  required     placeholder="Enter last name" id="lastn"  class="border-2 rounded-md  w-full focus:border-[#7A263A] focus:outline-none  p-1"></div>

                </div>

                  <label class="block  text-lg mb-1 text-[#7A263A]" for="">Email</label><input  required  type="email" id="emaill" placeholder="Enter your  email"  class="border-2 border w-full rounded-md focus:border-[#7A263A] focus:outline-none  p-1">
                   <label class="block    text-lg text-[#7A263A]  mb-1" for="">Password</label><input   required type="password" id="pass" placeholder="Enter password" class="border-2 w-full rounded-md focus:border-[#7A263A] focus:outline-none  p-1" >
                  <button class="block  mt-2 mb-1 p-2 bg-blue-700 text-white rounded-xl">Register</button>
                  <p class="text-lg m-2">Already have an acount? <a href="login.html"  class="text-lg text-[#7A263A] ">Log in</a>
                  </p>
            </form>
       </div>
       </main>
       <script src="js/register.js"></script>
</body>

   


</section>
